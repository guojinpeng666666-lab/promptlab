# IT 工单处理测试集（P0 初始样例，15 条）
# 分类枚举：网络故障、账号权限、硬件设备、软件应用、其他
name: IT 工单处理测试集
description: 用于评估模型对 IT 支持工单的分类准确率、优先级判断与摘要关键信息提取能力

cases:
  # --- 网络故障 (3 条，含边界用例 T003) ---
  - id: T001
    input: >
      三楼西区工位的有线网络从今天上午 9 点半开始完全断开，电脑右下角一直显示“无 Internet 访问”。
      问了旁边三位同交换机下的同事也都断网了，在命令行 ping 网关 10.10.3.1 全部超时。
    expect:
      category: 网络故障
      keywords: ["三楼西区", "有线网络"]

  - id: T002
    input: >
      居家办公连接公司 SSL VPN 时反复提示“认证超时，无法建立隧道”，
      尝试切换成手机 5G 热点后依然连接失败，急需连回内网拉取代码。
    expect:
      category: 网络故障
      keywords: ["VPN"]

  - id: T003
    # 边界用例 1：用户怀疑是系统/驱动问题且微信能用，容易误判为软件应用或硬件设备，实际是 DNS 解析异常（网络故障）
    input: >
      电脑打开所有外部网页都提示 ERR_NAME_NOT_RESOLVED 无法访问，但微信和 QQ 都能正常收发消息。
      我自己重装过网卡驱动还是不行，怀疑是不是 Windows 系统文件损坏了？
    expect:
      category: 网络故障
      keywords: ["网页"]

  # --- 账号权限 (3 条，含边界用例 T006) ---
  - id: T004
    input: >
      研发部今天新入职一名后端工程师，HR 系统已生成工号，
      需要统一开通企业微信、OA 审批系统以及代码托管平台 GitLab 的只读权限。
    expect:
      category: 账号权限
      keywords: ["权限", "GitLab"]

  - id: T005
    input: >
      早上连续输错 5 次域账号密码后，登录界面提示“账户已被锁定，请联系管理员”。
      目前无法解锁电脑和登录内网门户，请帮忙紧急解封并重置初始密码。
    expect:
      category: 账号权限
      keywords: ["锁定"]

  - id: T006
    # 边界用例 2：用户称“页面打不开、以为服务器挂了”，容易误判为软件应用或网络故障，实际核心报错是 403 无访问权限
    input: >
      登录财务报销系统后点击费用申请模块一直打不开，页面直接报“403 Forbidden：当前角色无访问权限”。
      同事都以为是报销系统服务器崩溃挂了，请运维赶紧重启一下服务。
    expect:
      category: 账号权限
      keywords: ["报销系统", "权限"]

  # --- 硬件设备 (3 条) ---
  - id: T007
    input: >
      配发的 ThinkPad 办公笔记本开机后电源灯常亮、风扇狂转，但屏幕一直黑屏无任何画面，
      用 HDMI 外接工位显示器同样显示“无信号输入”。
    expect:
      category: 硬件设备
      keywords: ["笔记本", "黑屏"]

  - id: T008
    input: >
      二楼打印室的惠普激光打印机频繁卡纸并亮起红色故障灯，
      按照机身提示打开后盖取出残留纸张后，红灯依然闪烁，无法继续打印合同。
    expect:
      category: 硬件设备
      keywords: ["打印机", "卡纸"]

  - id: T009
    input: >
      工位上的 27 寸液晶显示器通电使用约半小时后就开始间歇性闪屏，屏幕右侧还出现一条绿色竖线，
      换了一根新的 DP 线并接到同事电脑上测试，竖线依然存在。
    expect:
      category: 硬件设备
      keywords: ["显示器"]

  # --- 软件应用 (3 条) ---
  - id: T010
    input: >
      财务电脑上的 Microsoft Excel 每次打开超过 50MB 的季度合并报表文件就会卡死并闪退，
      卸载重装 Office 365 套件后问题依旧，打开小体积表格则正常。
    expect:
      category: 软件应用
      keywords: ["Excel"]

  - id: T011
    input: >
      将本地 IntelliJ IDEA 升级到最新版本后，打开现有 Spring Boot 项目执行 Maven 构建时报错，
      提示编译器版本与当前插件不兼容，需要协助排查配置或回退客户端版本。
    expect:
      category: 软件应用
      keywords: ["IDEA"]

  - id: T012
    input: >
      电脑端企业微信客户端点击“审批”工作台应用后一直转圈白屏无法加载，
      但同一账号在手机端和浏览器网页版上均能正常查看和提交审批单。
    expect:
      category: 软件应用
      keywords: ["企业微信", "审批"]

  # --- 其他 (3 条) ---
  - id: T013
    input: >
      申请本周五下午 14:00 至 16:00 借用三楼一号大会议室召开部门季度复盘会，
      预计参会 30 人，需要提前协调摆放桌椅及准备茶歇饮用水。
    expect:
      category: 其他
      keywords: ["会议室"]

  - id: T014
    # 边界用例 3：办公设施走行政物业，归「其他」，模型易误判为硬件设备
    input: >
      刚搬到 B 区 12 号新工位，发现桌下插线板电源孔位松动容易接触不良，
      另外配备的办公椅气压杆无法锁住高度，请安排物业或行政师傅来维修更换。
    expect:
      category: 其他
      keywords: ["工位"]

  - id: T015
    input: >
      请问今年公司组织的年度健康体检，线上报告查询入口在哪里？
      纸质版体检报告大约什么时候统一发放，以及家属优惠体检名额如何登记报名？
    expect:
      category: 其他
      keywords: ["体检"]
